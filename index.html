<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Interros - Flashcards</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<p>Principal (CSV) : <input type="file" id="main" accept=".csv"></p>
<p>Secondaires (CSV, plusieurs) : <input type="file" id="secs" accept=".csv" multiple></p>
<p>Questions : <input type="number" id="nq" value="5" min="1" style="width:50px">
   % principal : <input type="number" id="ratio" value="60" min="0" max="100" style="width:50px">
   Interros : <input type="number" id="nex" value="4" min="1" style="width:50px"></p>
<p>Face : <label><input type="radio" name="f" value="1" checked> 1</label>
   <label><input type="radio" name="f" value="mix"> 1 ou 2</label></p>
<p>Titre : <input type="text" id="titre" value="Interrogation 1 : L'atome">
   Date : <input type="text" id="date" value="12/06/2026"></p>
<button onclick="go()">Générer le PDF</button><span id="msg"></span>

<script>
const $ = id => document.getElementById(id);
const sel = a => a[Math.floor(Math.random() * a.length)];

function parse(txt) { // lignes alternées question/réponse
  const l = txt.split(/\r?\n/).map(s => s.trim()).filter(Boolean), c = [];
  for (let i = 0; i + 1 < l.length; i += 2) c.push([l[i], l[i + 1]]);
  return c;
}

function go() {
  const files = [$("main").files[0], ...$("secs").files].filter(Boolean);
  if (!files.length) { $("msg").textContent = "Choisissez un CSV."; return; }
  Promise.all(files.map(f => f.text())).then(texts => {
    const main = parse(texts[0]);
    const secs = texts.slice(1).flatMap(parse);
    const mix = document.querySelector('input[name="f"]:checked').value === "mix";
    const nq = +$("nq").value, ratio = +$("ratio").value / 100, nex = +$("nex").value;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const w = 190, h = (297 - 26) / 2; // 2 sujets par page A4

    for (let e = 0; e < nex; e++) {
      if (e && !(e % 2)) doc.addPage();
      // tirage indépendant pour chaque interro
      const nm = Math.min(Math.round(nq * ratio), main.length);
      let cards = [];
      while (cards.length < nq)
        cards.push(sel(cards.length < nm || !secs.length ? main : secs));
      const qs = cards.map(c => mix ? sel(c) : c[0]); // texte brut, sans "Face 1:"

      draw(doc, 10, 10 + (e % 2) * (h + 6), w, h, qs, nex, e + 1);
    }
    doc.save("interrogations.pdf");
    $("msg").textContent = " OK !";
  });
}

function draw(doc, x, y, w, h, qs, total, num) {
  doc.setDrawColor(180); doc.rect(x, y, w, h);
  doc.setFontSize(11).setFont("helvetica", "bold");
  doc.text("Nom :", x + 8, y + 10);
  doc.text("Note sur " + total + " :", x + w - 45, y + 10);
  doc.text("Prénom :", x + 8, y + 18);
  doc.setFontSize(10).setFont("helvetica", "normal");
  doc.text($("date").value + " - " + $("titre").value, x + 8, y + 28);
  doc.line(x + 8, y + 31, x + w - 8, y + 31);
  let cy = y + 42;
  qs.forEach((q, i) => {
    doc.text(String(i + 1) + ". " + q, x + 8, cy);
    doc.text("/1", x + w - 18, cy);
    cy += 11;
  });
  doc.setFontSize(8).setTextColor(150);
  doc.text("#" + num, x + w - 8, y + h - 4, { align: "right" });
  doc.setTextColor(0);
}
</script>
</body>
</html>
